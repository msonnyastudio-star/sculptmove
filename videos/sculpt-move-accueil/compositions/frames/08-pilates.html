    (function(){
      const root=document.querySelector('[data-composition-id="08-pilates"]');

      const tl=gsap.timeline({paused:true});
      const cqh=n=>n*root.clientHeight/100;
      // Resserrement de l'interlettrage par translation de chaque lettre (mesuré une fois, à la construction)
      const track=(el,em,at,dur)=>{
        const txt=el.textContent; el.textContent='';
        const cs=[];
        txt.split(' ').forEach((word,index,all)=>{
          const w=document.createElement('span');w.style.cssText='display:inline-block;white-space:nowrap';
          [...word].forEach(c=>{const s=document.createElement('span');s.className='s8-ch';s.textContent=c;w.appendChild(s);cs.push(s);});
          el.appendChild(w);
          if(index<all.length-1) el.appendChild(document.createTextNode(' '));
        });
        const px=em*parseFloat(getComputedStyle(el).fontSize);
        tl.fromTo(el,{opacity:0},{opacity:1,duration:dur*.75,ease:'power2.out'},at);
        tl.fromTo(cs,{x:i=>i*px},{x:0,duration:dur,ease:'power3.out'},at);
      };
      // Trait dessiné : chaque tracé porte pathLength="1"
      const draw=(sel,at,dur,stagger=0)=>tl.fromTo(qa(sel),{strokeDasharray:1,strokeDashoffset:1},{strokeDashoffset:0,duration:dur,ease:'power2.inOut',stagger},at);

      tl.fromTo(q('.s8-tapis'),{xPercent:9,opacity:0},{xPercent:0,opacity:1,duration:1.4,ease:'expo.out'},.4);
      settle('.s8-tapis img',.4,1.15,2.2);
      tl.fromTo(q('.s8-femme'),{clipPath:'inset(0% 0% 100% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:.9,ease:'power4.inOut'},.85);
      settle('.s8-femme img',.85,1.3,1.8);
      draw('.s8-bandline',.9,.8);
      tl.fromTo(qa('.s8-dot1,.s8-dot2'),{scale:0,transformOrigin:'50% 50%'},{scale:1,duration:.5,ease:'back.out(2)',stagger:.5},.85);
      // La bande se tend : la courbe s'aplatit, avec un léger rebond
      const band={k:1}, line=q('.s8-bandline');
      tl.fromTo(band,{k:1},{k:0,duration:1,ease:'elastic.out(1,.55)',onUpdate:()=>{const y=100+90*band.k;line.setAttribute('d','M10 100C200 '+y+' 500 '+y+' 690 100');}},1.75);
      lines('.s8-title .s8-l',.45);
      chrome(.75); rule(1.2);
      track(q('.s8-kicker'),.26,1.3,1.1);
      tl.fromTo(q('.s8-price'),{xPercent:-30,opacity:0},{xPercent:0,opacity:1,duration:.8,ease:'expo.out'},1.75);

      window.__timelines['08-pilates']=tl;
    })();
