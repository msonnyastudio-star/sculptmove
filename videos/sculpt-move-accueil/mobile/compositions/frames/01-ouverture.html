    .s1-ground{position:absolute;inset:0;background:radial-gradient(95% 85% at 50% 50%,#41185a 0%,#321044 52%,#240a31 100%)}

    /* Lockup — identique à la dernière image du film (05-collection) pour une boucle sans couture */
    .s1-open{position:absolute;inset:0;background:radial-gradient(95% 85% at 50% 50%,#ffffff 0%,#fbf7f0 60%,#f1e7da 100%);color:#321044}

    @container (max-aspect-ratio: 1/1){

  </style>
  <div id="root" data-composition-id="01-ouverture" data-width="1080" data-height="1350" data-duration="4.7">
    <div id="s1-ground" class="clip s1-ground" data-start="0" data-duration="4.7" data-track-index="0"></div>

    <div class="s1-photo"><img data-layout-allow-overflow src="assets/v2/portrait.jpg" alt="La femme Sculpt Move, sourire serein"></div>
    <div class="s1-key" aria-hidden="true"></div>

    <div class="s1-chrome"><b>N° 01</b><i></i><span>Le rituel</span></div>
    <h1 class="s1-title">
      <span class="s1-m"><span class="s1-l">Votre beauté,</span></span>
      <span class="s1-m"><span class="s1-l"><em>votre rituel.</em></span></span>
    </h1>
    <div class="s1-rule" aria-hidden="true"></div>
    <p class="s1-kicker">DE L’INTÉRIEUR À L’EXTÉRIEUR</p>

    <div class="s1-open">
      <div class="s1-lockup">
        <img class="s1-logo" src="assets/logo/sculpt-move-logo.png" width="1215" height="796" alt="Logo Sculpt Move">
        <div class="s1-word">SCULPT MOVE</div>
        <div class="s1-tag"><i></i><span>WELLNESS PARTNER</span><i></i></div>
      </div>
    </div>
    <div class="s1-edge" data-layout-allow-overflow aria-hidden="true"><i></i></div>
  </div>
  <script>
    (function(){
      const root=document.querySelector('[data-composition-id="01-ouverture"]');
      const q=s=>root.querySelector(s), qa=s=>root.querySelectorAll(s);
      const tl=gsap.timeline({paused:true});
      // Resserrement de l'interlettrage par translation de chaque lettre (mesuré une fois, à la construction)
      const track=(el,em,centered,at,dur)=>{
        const txt=el.textContent; el.textContent='';
        const cs=[...txt].map(c=>{const s=document.createElement('span');s.className='s1-ch';s.textContent=c;el.appendChild(s);return s;});
        const px=em*parseFloat(getComputedStyle(el).fontSize), mid=(cs.length-1)/2;
        tl.fromTo(el,{opacity:0},{opacity:1,duration:dur*.75,ease:'power2.out'},at);
        tl.fromTo(cs,{x:i=>(centered?i-mid:i)*px},{x:0,duration:dur,ease:'power3.out'},at);
      };

      // Mêmes lettres séparées qu'à la fermeture (05-collection) : l'espacement reste identique à la boucle
      const word=q('.s1-word'), letters=[...word.textContent]; word.textContent='';
      letters.forEach(c=>{const s=document.createElement('span');s.className='s1-ch';s.textContent=c;word.appendChild(s);});

      // 0 → 1.05 : le logo respire puis traverse l'écran vers le spectateur (zoom-through)
      tl.fromTo(q('.s1-lockup'),{scale:1,filter:'blur(0px)'},{scale:1.05,duration:.8,ease:'power1.in'},0);
      tl.to(q('.s1-lockup'),{scale:1.24,filter:'blur(10px)',duration:.26,ease:'power3.in'},.8);
      tl.fromTo(q('.s1-lockup'),{opacity:1},{opacity:0,duration:.24,ease:'none'},.8);

      // Le fond ivoire s'efface en volet descendant, dans le prolongement de la fermeture du film
      tl.fromTo(q('.s1-open'),{clipPath:'inset(0% 0% 0% 0%)'},{clipPath:'inset(100% 0% 0% 0%)',duration:.75,ease:'power4.inOut'},.78);
      tl.fromTo(q('.s1-edge'),{yPercent:-100},{yPercent:0,duration:.75,ease:'power4.inOut'},.78);
      tl.fromTo(q('.s1-edge'),{opacity:0},{opacity:1,duration:.02,ease:'none'},.78);
      tl.to(q('.s1-edge'),{opacity:0,duration:.3,ease:'power1.out'},1.45);

      // Le portrait s'ouvre depuis une fente centrale, l'image se pose en douceur
      tl.fromTo(q('.s1-photo'),{clipPath:'inset(0% 50% 0% 50%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:1.15,ease:'power4.inOut'},.78);
      tl.fromTo(q('.s1-photo img'),{scale:1.36},{scale:1,duration:2.7,ease:'expo.out'},.78);
      tl.fromTo(q('.s1-key'),{clipPath:'inset(0% 100% 100% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:.95,ease:'power3.inOut'},1.55);

      // Titre ligne par ligne dans ses masques
      tl.fromTo(qa('.s1-l'),{yPercent:112},{yPercent:0,duration:1.15,ease:'power4.out',stagger:.13},1.12);
      tl.fromTo(q('.s1-chrome'),{opacity:0,x:-14},{opacity:1,x:0,duration:.8,ease:'power3.out'},1.5);

      // Filet doré puis accroche qui se resserre
      tl.fromTo(q('.s1-rule'),{scaleX:0},{scaleX:1,duration:.95,ease:'power3.inOut'},2.0);
      track(q('.s1-kicker'),.4,false,2.25,1.35);

      window.__timelines['01-ouverture']=tl;
    })();
  </script>
