<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#321044" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/images/pdrn-jar.jpg" fetchpriority="high" />
    <meta name="description" content="Découvrez les essentiels beauté et bien-être Sculpt Move : multi-collagène peptides, gummies glutathion, crème PDRN et Beauty Duo. Commande sur WhatsApp, expédition depuis Akwa (Douala) partout au Cameroun et dans la sous-région." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SCULPT MOVE — La beauté commence aussi de l’intérieur" />
    <meta property="og:description" content="Les essentiels beauté Sculpt Move. Commandez sur WhatsApp, expédition partout au Cameroun et dans la sous-région." />
    <meta property="og:image" content="/images/sculpt-move-duo.jpg" />
    <title>SCULPT MOVE — La beauté commence aussi de l’intérieur</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "name": "SCULPT MOVE", "url": "https://sculptmove.online/" },
          { "@type": "Organization", "name": "SCULPT MOVE", "url": "https://sculptmove.online/", "logo": "https://sculptmove.online/icons/icon-512.png", "email": "contact@sculptmove.online" }
        ]
      }
    </script>
    <script>
      // Thème, langue et animations posés avant le premier affichage (évite le flash clair en mode nuit).
      (function () {
        var root = document.documentElement
        try {
          var theme = localStorage.getItem('sculpt-move-theme')
          if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          root.dataset.theme = theme
          var lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('sculpt-move-lang')
          if (lang !== 'fr' && lang !== 'en') lang = /^en\b/i.test(navigator.language) ? 'en' : 'fr'
          root.lang = lang
        } catch (error) {}
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('motion')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
